name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Node ${{ matrix.node }} portable tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:portable
      - run: npm run verify-public

  local-workbook-gate:
    name: Workbook-suite contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/update_tracker.mjs
      - run: node --check scripts/preflight.mjs
      - run: node --check scripts/apply_query_budget.mjs
      - run: node --check scripts/job_alert_ingestion_lib.mjs
      - run: node --check scripts/ingest_job_alerts.mjs
      - run: node --check scripts/historical_tracker_import_lib.mjs
      - run: node --check scripts/import_tracker_history.mjs
      - run: node --check scripts/notification_delivery_lib.mjs
      - run: node --check scripts/notification_connector_contract.mjs
      - run: node --check scripts/notification_connector_runtime.mjs
      - run: node --check scripts/notification_connector_renderer.mjs
      - run: node --check scripts/notification_connector_discovery.mjs
      - run: node --check scripts/notification_connector_drift.mjs
      - run: node --check scripts/notification_connector_catalog_history.mjs
      - run: node --check scripts/notification_connector_profile_plan.mjs
      - run: node --check scripts/notification_delivery_health_lib.mjs
      - run: node --check scripts/notification_status_runtime.mjs
      - run: node --check scripts/notification_status_contract.mjs
      - run: node --check scripts/manage_notification_connector.mjs
      - run: node --check scripts/import_notification_connector_discovery.mjs
      - run: node --check scripts/inspect_notification_connector_drift.mjs
      - run: node --check scripts/inspect_notification_connector_catalog_history.mjs
      - run: node --check scripts/plan_notification_connector_profile.mjs
      - run: node --check scripts/manage_notification_status_connector.mjs
      - run: node --check scripts/dispatch_notifications.mjs
      - run: node --check scripts/probe_notification_status.mjs
      - run: node --check scripts/inspect_notification_health.mjs
      - run: node --check scripts/deliver_notifications.mjs
      - run: echo "Full workbook integration tests run in the Codex release environment with the bundled @oai/artifact-tool dependency."
